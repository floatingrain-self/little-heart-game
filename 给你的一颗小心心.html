<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给你的一颗小心心 💗</title>
<style>
  :root { --pink:#ff8fb3; --deep:#d94f83; --cream:#fff8f3; --ink:#70465a; --mint:#bfe8d4; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:18px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color:var(--ink); background:radial-gradient(circle at 20% 15%, #fff 0 4%, transparent 30%),
      linear-gradient(135deg,#ffe4ed,#fff4e8 55%,#fce0ed);
  }
  .app { width:min(760px,100%); }
  .top { text-align:center; margin-bottom:14px; }
  h1 { margin:0 0 6px; font-size:clamp(25px,5vw,38px); letter-spacing:1px; }
  .subtitle { margin:0; color:#a16b83; font-size:14px; }
  .panel {
    background:rgba(255,255,255,.78); border:2px solid #fff; border-radius:24px;
    box-shadow:0 14px 40px #c76b8b22; padding:clamp(12px,3vw,22px);
  }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 2px 12px; flex-wrap:wrap; }
  .pill { background:#fff0f5; border:1px solid #ffd0df; border-radius:999px; padding:8px 13px; font-size:14px; }
  #game {
    width:100%; display:block; border-radius:18px; background:#fff9f3; border:2px solid #ffe0e9;
    touch-action:none;
  }
  .controls { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap; }
  .hint { font-size:13px; line-height:1.6; color:#a16b83; flex:1; min-width:180px; }
  .dpad { display:grid; grid-template-columns:repeat(3,42px); grid-template-rows:repeat(2,38px); gap:5px; }
  button { border:0; cursor:pointer; font:inherit; transition:transform .12s,filter .12s; }
  button:active { transform:scale(.95); }
  .direction { border-radius:12px; background:#ffe0eb; color:#b84f79; font-size:18px; box-shadow:0 3px 0 #f4b7ce; touch-action:none; }
  .direction[data-dir="up"] { grid-column:2; grid-row:1; }
  .direction[data-dir="left"] { grid-column:1; grid-row:2; }
  .direction[data-dir="down"] { grid-column:2; grid-row:2; }
  .direction[data-dir="right"] { grid-column:3; grid-row:2; }
  .primary { background:linear-gradient(135deg,#ff8fb3,#f36e9b); color:white; padding:12px 22px; border-radius:999px; font-weight:700; box-shadow:0 5px 0 #d95e8b; }
  .secondary { background:#fff0f5; color:#b84f79; padding:10px 17px; border-radius:999px; }
  .overlay { position:fixed; inset:0; background:#70465a55; display:none; place-items:center; padding:20px; z-index:5; }
  .overlay.show { display:grid; }
  .modal { width:min(440px,100%); text-align:center; background:#fffaf7; border:3px solid white; border-radius:28px; padding:30px 22px; box-shadow:0 18px 70px #6c254544; animation:pop .45s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { from{transform:scale(.75);opacity:0} to{transform:scale(1);opacity:1} }
  .bigheart { font-size:54px; animation:beat 1s infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.13)} }
  .message { font-size:clamp(20px,4vw,27px); line-height:1.65; font-weight:800; color:#d94f83; margin:10px 0 8px; }
  .small { color:#a16b83; font-size:14px; line-height:1.7; }
  .footer { text-align:center; font-size:12px; color:#b7869a; margin-top:12px; }
  @media (max-width:500px) { .controls{justify-content:center} .hint{flex-basis:100%;text-align:center} }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>给你的一颗小心心 💗</h1>
    <p class="subtitle">一场很小很小、但只为你准备的冒险</p>
  </header>
  <section class="panel">
    <div class="hud">
      <span class="pill">💗 收集进度：<b id="count">0</b> / 10</span>
      <span class="pill" id="status">找到所有小心心吧！</span>
    </div>
    <canvas id="game" width="700" height="430" aria-label="爱心收集游戏区域"></canvas>
    <div class="controls">
      <div class="hint">电脑：方向键 / WASD 移动<br>手机：按住右边方向按钮移动<br>把地图里的 10 颗小心心都收集起来吧！</div>
      <div class="dpad" aria-label="移动按钮">
        <button class="direction" data-dir="up" aria-label="向上">▲</button>
        <button class="direction" data-dir="left" aria-label="向左">◀</button>
        <button class="direction" data-dir="down" aria-label="向下">▼</button>
        <button class="direction" data-dir="right" aria-label="向右">▶</button>
      </div>
    </div>
  </section>
  <div class="footer">小心心已经准备好啦 · 祝你玩得开心 ✨</div>
</main>

<div class="overlay" id="ending" role="dialog" aria-modal="true" aria-labelledby="endingTitle">
  <div class="modal">
    <div class="bigheart">💖</div>
    <div class="message" id="endingTitle">恭喜收集完毕。</div>
    <div class="message" style="font-size:clamp(21px,4vw,28px)">康宇琴想说，<br>很幸运遇见你。</div>
    <p class="small">地图里的小心心有 10 颗，<br>但想给你的心意不止这些。</p>
    <button class="primary" id="again">再玩一次 ♡</button>
    <button class="secondary" id="close">把这份心意收好</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const countEl = document.getElementById('count');
  const statusEl = document.getElementById('status');
  const ending = document.getElementById('ending');
  const W = canvas.width, H = canvas.height;
  const keys = new Set();
  const player = { x: 72, y: 76, r: 13, speed: 2.65 };
  const positions = [
    [165,72],[300,80],[515,68],[615,145],[485,185],
    [340,165],[160,205],[75,325],[300,350],[570,330]
  ];
  let hearts = [], collected = 0, last = 0, sparkle = 0;
  const heartChar = '♥';
  function reset() {
    player.x=72; player.y=76; collected=0;
    hearts=positions.map(([x,y],i)=>({x,y,r:12,got:false,phase:i*.8}));
    countEl.textContent='0'; statusEl.textContent='找到所有小心心吧！';
    ending.classList.remove('show'); last=0; draw();
  }
  function roundedRect(x,y,w,h,r,fill) {
    ctx.fillStyle=fill; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }
  function drawHeart(x,y,size,color) {
    ctx.save(); ctx.translate(x,y); ctx.scale(size/20,size/20);
    ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,7);
    ctx.bezierCurveTo(-18,-4,-10,-16,0,-8);
    ctx.bezierCurveTo(10,-16,18,-4,0,7); ctx.fill(); ctx.restore();
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    // soft checkerboard garden
    for(let y=0;y<H;y+=35) for(let x=0;x<W;x+=35) {
      ctx.fillStyle=((x/35+y/35)%2===0)?'#fff9f3':'#fff5f1';
      ctx.fillRect(x,y,35,35);
    }
    // little flowers and dotted paths
    for(let i=0;i<24;i++) {
      const x=(i*97+29)%W, y=(i*61+21)%H;
      ctx.fillStyle='#f5c8d7'; ctx.globalAlpha=.72;
      ctx.beginPath(); ctx.arc(x,y,2.3,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.strokeStyle='#f3c7d6'; ctx.lineWidth=2; ctx.setLineDash([4,8]);
    ctx.beginPath(); ctx.moveTo(40,115); ctx.bezierCurveTo(230,10,450,300,660,115); ctx.stroke(); ctx.setLineDash([]);
    hearts.forEach(h=>{
      if(h.got) return;
      const bob=Math.sin(sparkle*.06+h.phase)*3;
      ctx.globalAlpha=.22; drawHeart(h.x,h.y+bob,32,'#ff8fb3'); ctx.globalAlpha=1;
      drawHeart(h.x,h.y+bob,20,'#f36e9b');
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(h.x-3,h.y+bob-4,2.2,0,Math.PI*2); ctx.fill();
    });
    // player shadow and character
    ctx.globalAlpha=.18; ctx.fillStyle='#a64d76'; ctx.beginPath(); ctx.ellipse(player.x,player.y+16,14,5,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
    const pulse=1+Math.sin(sparkle*.12)*.05;
    drawHeart(player.x,player.y,34*pulse,'#e9568b');
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(player.x-4,player.y-5,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#a94b73'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('你',player.x,player.y+31);
    // border decorations
    ctx.strokeStyle='#f7c6d8'; ctx.lineWidth=4; ctx.strokeRect(3,3,W-6,H-6);
  }
  function update(ts) {
    if(!last) last=ts;
    const dt=Math.min((ts-last)/16.67,2); last=ts; sparkle++;
    let dx=0,dy=0;
    if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A')||keys.has('left')) dx--;
    if(keys.has('ArrowRight')||keys.has('d')||keys.has('D')||keys.has('right')) dx++;
    if(keys.has('ArrowUp')||keys.has('w')||keys.has('W')||keys.has('up')) dy--;
    if(keys.has('ArrowDown')||keys.has('s')||keys.has('S')||keys.has('down')) dy++;
    if(dx&&dy){dx*=.707;dy*=.707;}
    player.x=Math.max(22,Math.min(W-22,player.x+dx*player.speed*dt));
    player.y=Math.max(22,Math.min(H-22,player.y+dy*player.speed*dt));
    hearts.forEach(h=>{
      if(!h.got && Math.hypot(player.x-h.x,player.y-h.y)<25) {
        h.got=true; collected++; countEl.textContent=collected;
        statusEl.textContent=collected===10?'所有心意都收集到了！':'叮！收下一颗小心心';
        if(collected===10) setTimeout(()=>ending.classList.add('show'),500);
      }
    });
    draw(); requestAnimationFrame(update);
  }
  document.addEventListener('keydown',e=>{
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    keys.add(e.key);
  });
  document.addEventListener('keyup',e=>keys.delete(e.key));
  window.addEventListener('blur',()=>keys.clear());
  document.querySelectorAll('.direction').forEach(btn=>{
    const dir=btn.dataset.dir;
    const start=e=>{e.preventDefault();keys.add(dir);};
    const stop=e=>{e.preventDefault();keys.delete(dir);};
    btn.addEventListener('pointerdown',start);
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,stop));
  });
  document.getElementById('again').addEventListener('click',reset);
  document.getElementById('close').addEventListener('click',()=>ending.classList.remove('show'));
  reset(); requestAnimationFrame(update);
})();
</script>
</body>
</html>
